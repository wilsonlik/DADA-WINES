name: Nightly catalogue update

on:
  schedule:
    - cron: '0 19 * * *'   # 03:00 Singapore time, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet requests playwright numpy pillow opencv-python-headless
          playwright install --with-deps chromium

      # Each scraper only overwrites its snapshot when the result looks sane,
      # so one site failing keeps that site's last good data.
      - name: Scrape Pivene
        run: python scripts/scrape_pivene.py
        continue-on-error: true

      - name: Scrape Crystal Wines
        run: python scripts/scrape_crystal.py
        continue-on-error: true

      - name: Scrape Cornerstone Wines
        run: python scripts/scrape_cornerstone.py
        continue-on-error: true

      - name: Cornerstone detail pages (ratings, type, region)
        run: python scripts/scrape_cornerstone_details.py
        continue-on-error: true

      - name: Merge
        run: python scripts/merge.py

      - name: Images (download new ones, remove score badges)
        run: python scripts/images.py
        continue-on-error: true

      - name: Build site
        run: python scripts/build.py

      - name: Commit and publish
        run: |
          git config user.name "catalogue-bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Nightly catalogue update $(TZ=Asia/Singapore date +%Y-%m-%d)"
            git push
          fi
