name: Fetch raw feeds only

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: 'space-separated scraper commands'
        required: true
        default: 'scrape_shopify.py all'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4
      - name: Run scrapers
        run: |
          cd scripts
          IFS=';' read -ra CMDS <<< "${{ github.event.inputs.scripts }}"
          for c in "${CMDS[@]}"; do echo "== $c"; python $c || true; done
      - name: Commit raw data
        run: |
          git config user.name "catalogue-bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add data/raw data/ponti_details.json data/bnb_details.json
          git diff --cached --quiet || (git commit -m "Fetch raw feeds" && git push)
